    <!-- Inter — the face behind Linear, Vercel, GitHub and most modern product

         the stylesheet is still downloading instead of after it. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Front Row — Concert Ticket Tracking</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
